<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<title>3SU — Bán hàng</title>
<meta name="description" content="Phần mềm bán hàng cho người bán nhỏ Việt Nam">

<meta name="theme-color" content="#FAF7F2" id="meta-theme-color">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="3SU">

<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,300;8..60,400&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
<link rel="apple-touch-icon" href="/icons/icon-180.png">

<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https: wss:; frame-src 'self' https://accounts.google.com https://*.firebaseapp.com; base-uri 'self'; form-action 'self'; object-src 'none';">

<style>
  .splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#FAF7F2;color:#1C1917;z-index:9999}
  .splash-logo{font-family:Georgia,serif;font-weight:700;font-size:42px;letter-spacing:.02em}
  .splash-logo u{text-decoration:none;border-bottom:3px solid #B8935A;padding-bottom:2px}
  .splash-tag{margin-top:16px;font-family:system-ui,sans-serif;font-weight:600;font-size:11px;color:#78716C;letter-spacing:.14em;text-transform:uppercase}
  .splash-dots{margin-top:22px;display:flex;gap:8px}
  .splash-dots span{width:6px;height:6px;border-radius:50%;background:#A8A29E;animation:sp 1.2s infinite ease-in-out}
  .splash-dots span:nth-child(2){animation-delay:.2s}
  .splash-dots span:nth-child(3){animation-delay:.4s}
  @keyframes sp{0%,80%,100%{opacity:.3;transform:scale(.8)}40%{opacity:1;transform:scale(1.2)}}
  html[data-theme="dark"] .splash{background:#151515;color:#f0efec}
  html[data-theme="dark"] .splash-tag{color:#c3c2b7}
  html[data-theme="dark"] .splash-dots span{background:#8c8b82}
  html[data-theme="dark"] .splash-logo u{border-bottom-color:#c3c2b7}
</style>

<script>
  (function(){
    try{
      var pref = localStorage.getItem('3su_theme') || 'dark';
      var theme = pref === 'system'
        ? (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        : (pref === 'dark' ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
      var meta = document.getElementById('meta-theme-color');
      if(meta) meta.setAttribute('content', theme === 'dark' ? '#151515' : '#FAF7F2');
    }catch(_){ document.documentElement.setAttribute('data-theme','dark'); }
  })();
</script>
</head>
<body>
  <div id="root">
    <div class="splash">
      <div class="splash-logo"><u>3SU</u></div>
      <div class="splash-tag">Bán hàng</div>
      <div class="splash-dots"><span></span><span></span><span></span></div>
    </div>
  </div>
  <script type="module" src="/src/mobile/main.tsx"></script>
</body>
</html>
