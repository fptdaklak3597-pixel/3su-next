name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'agent/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency security audit
        run: npm run audit:security

      - name: Print agent syntax
        run: npm run check:print-agent

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build all applications
        run: npm run build:all

      - name: E-invoice package typecheck
        run: npx tsc -p packages/3su-einvoice/tsconfig.json --noEmit

      - name: E-invoice package tests
        run: npx vitest run --config packages/3su-einvoice/vitest.config.ts

      - name: E-invoice package build
        run: npx tsc -p packages/3su-einvoice/tsconfig.build.json
