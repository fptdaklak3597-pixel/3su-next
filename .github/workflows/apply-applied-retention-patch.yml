name: Apply applied-op retention patch

on:
  push:
    branches:
      - agent/applied-op-retention

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[retention-patched]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/applied-op-retention
          fetch-depth: 0

      - name: Apply patch
        run: node scripts/patch-applied-retention.mjs

      - name: Remove one-shot patch files
        run: rm -- scripts/patch-applied-retention.mjs .github/workflows/apply-applied-retention-patch.yml

      - name: Commit generated change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/core/sync/engine.ts src/core/db.ts scripts/patch-applied-retention.mjs .github/workflows/apply-applied-retention-patch.yml
          git commit -m 'Require server watermark for applied-op GC [retention-patched]'
          git push origin HEAD:agent/applied-op-retention
