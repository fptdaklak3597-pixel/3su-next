name: Refresh dependency lock

on:
  push:
    branches:
      - agent/dependency-security-v2

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, '[lock-refresh]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/dependency-security-v2
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Regenerate lockfile
        run: |
          npm install --package-lock-only --ignore-scripts
          npm audit fix --package-lock-only --ignore-scripts || true

      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'Lockfile already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- package-lock.json
          git commit -m 'Refresh dependency lock [lock-refresh]'
          git push origin HEAD:agent/dependency-security-v2
