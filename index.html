<!DOCTYPE html>
<html lang="vi" data-shell="web">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>3SU — Phần mềm bán hàng</title>
<meta name="description" content="Phần mềm bán hàng cho người bán nhỏ Việt Nam">
<link rel="canonical" href="https://3su.shop/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,300;8..60,400&display=swap" rel="stylesheet">

<meta name="theme-color" content="#1E40AF" id="meta-theme-color">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="3SU">

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
<link rel="apple-touch-icon" href="/icons/icon-180.png">

<meta http-equiv="Content-Security-Policy" content="base-uri 'self'; form-action 'self'; object-src 'none';">

<style>
  /* Splash hiển thị tới khi React mount lần đầu */
  .splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#1E40AF;color:#fff;z-index:9999}
  .splash-logo{font-family:"SF Pro Display","SF Pro Text",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Inter,system-ui,sans-serif;font-weight:600;font-style:normal;font-size:42px;letter-spacing:-.022em}
  .splash-logo u{text-decoration:none;border-bottom:3px solid #D97706;padding-bottom:2px}
  .splash-tag{margin-top:16px;font-family:system-ui,sans-serif;font-weight:600;font-size:11px;color:rgba(255,255,255,.75);letter-spacing:.14em;text-transform:uppercase}
  .splash-dots{margin-top:22px;display:flex;gap:8px}
  .splash-dots span{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.7);animation:sp 1.2s infinite ease-in-out}
  .splash-dots span:nth-child(2){animation-delay:.2s}
  .splash-dots span:nth-child(3){animation-delay:.4s}
  @keyframes sp{0%,80%,100%{opacity:.3;transform:scale(.8)}40%{opacity:1;transform:scale(1.2)}}
  html[data-theme="dark"] .splash{background:#151515;color:#f0efec}
  html[data-theme="dark"] .splash-tag{color:#c3c2b7}
  html[data-theme="dark"] .splash-dots span{background:#8c8b82}
  html[data-theme="dark"] .splash-logo u{border-bottom-color:#c3c2b7}
</style>

<script>
  /* No-flash theme: đọc localStorage đồng bộ trước khi paint */
  (function(){
    try{
      var pref = localStorage.getItem('3su_theme') || 'dark';
      var theme = pref === 'system'
        ? (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        : (pref === 'dark' ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
      var meta = document.getElementById('meta-theme-color');
      if(meta) meta.setAttribute('content', theme === 'dark' ? '#151515' : '#1E40AF');
    }catch(_){ document.documentElement.setAttribute('data-theme','dark'); }
  })();
</script>
</head>
<body>
  <div id="root">
    <div class="splash">
      <div class="splash-logo"><u>3SU</u></div>
      <div class="splash-tag">Phần mềm bán hàng</div>
      <div class="splash-dots"><span></span><span></span><span></span></div>
    </div>
  </div>
  <script type="module" src="/src/web/main.tsx"></script>
</body>
</html>
